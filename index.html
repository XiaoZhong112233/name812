<style>
:root{
  --bg:#e8ecf3;
  --light:#ffffff;
  --dark:#c2cad9;
  --ink:#69738a;
  --ink-soft:#9aa4b8;
  --out:9px 9px 18px var(--dark), -9px -9px 18px var(--light);
  --out-lg:14px 14px 28px var(--dark), -14px -14px 28px var(--light);
  --out-hover:11px 11px 22px var(--dark), -11px -11px 22px var(--light);
  --in:inset 7px 7px 14px var(--dark), inset -7px -7px 14px var(--light);
  --in-lg:inset 10px 10px 20px var(--dark), inset -10px -10px 20px var(--light);
  --in-deep:inset 10px 10px 20px var(--dark), inset -10px -10px 20px var(--light);
  --ok:#2e9e6b;--no:#d45450;
  --ok-soft:rgba(46,158,107,.36);--no-soft:rgba(212,84,80,.36);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2c313c;--light:#3b4250;--dark:#1e222b;--ink:#c3cad8;--ink-soft:#818b9e;
    --ok:#6bdaa4;--no:#ff8f89;--ok-soft:rgba(107,218,164,.30);--no-soft:rgba(255,143,137,.30);
  }
}
:root[data-theme="dark"]{
  --bg:#2c313c;--light:#3b4250;--dark:#1e222b;--ink:#c3cad8;--ink-soft:#818b9e;
  --ok:#6bdaa4;--no:#ff8f89;--ok-soft:rgba(107,218,164,.30);--no-soft:rgba(255,143,137,.30);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-tap-highlight-color:transparent;
}
.card{
  width:min(100%,440px);padding:26px;border-radius:36px;background:var(--bg);
  box-shadow:var(--out-lg);
  display:flex;flex-direction:column;align-items:center;gap:26px;
}
.frame{
  position:relative;width:100%;aspect-ratio:4/3;border-radius:26px;
  background:var(--bg);box-shadow:var(--in-lg);padding:18px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.frame::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 4px var(--tint), inset 0 0 48px var(--tint);
}
.card.fx-ok .frame::after{--tint:var(--ok-soft);animation:halo 1.05s ease-out}
.card.fx-no .frame::after{--tint:var(--no-soft);animation:halo 1.05s ease-out}
@keyframes halo{0%{opacity:0;transform:scale(.97)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
#photo{
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;border-radius:16px;
  box-shadow:7px 7px 16px var(--dark), -7px -7px 16px var(--light);
  opacity:0;transform:scale(.985);
  transition:opacity .4s ease, transform .4s ease;
  user-select:none;-webkit-user-drag:none;
}
#photo.ready{opacity:1;transform:scale(1)}
.card.fx-ok #photo.ready{animation:photoOk .85s ease-out}
.card.fx-no #photo.ready{animation:photoNo .5s ease}
@keyframes photoOk{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes photoNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.badge{
  position:absolute;width:108px;height:108px;border-radius:50%;background:var(--bg);
  box-shadow:10px 10px 22px var(--dark), -10px -10px 22px var(--light);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.78);pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.badge.show{opacity:1;transform:scale(1);animation:pop .45s cubic-bezier(.2,1.35,.4,1)}
.badge.no.show{animation:pop .45s cubic-bezier(.2,1.35,.4,1), wobble .42s .32s ease}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-14deg)}60%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.badge svg{width:48px;height:48px;fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.badge.ok svg{stroke:var(--ok)}
.badge.no svg{stroke:var(--no)}
.broken{
  position:absolute;width:96px;height:96px;border-radius:50%;background:var(--bg);
  box-shadow:var(--in);display:none;align-items:center;justify-content:center;
}
.broken.show{display:flex}
.broken svg{width:42px;height:42px;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.controls{display:flex;align-items:center;justify-content:center;gap:20px;width:100%}
.btn{
  flex:0 0 auto;width:64px;height:64px;border:0;border-radius:50%;padding:0;
  background:var(--bg);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--out);transition:box-shadow .18s ease, transform .18s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--out-hover)}
.btn:active,.btn.is-pressed{transform:none;box-shadow:var(--in)}
.btn:focus-visible{outline:none;box-shadow:var(--out), 0 0 0 3px var(--ink-soft)}
.btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.answer{
  flex:0 1 190px;min-width:0;height:64px;border:0;border-radius:32px;outline:none;
  background:var(--bg);color:var(--ink);text-align:center;
  font:600 24px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:2px;box-shadow:var(--in);transition:box-shadow .25s ease;
  appearance:none;-moz-appearance:textfield;
}
.answer::placeholder{font-size:15px;font-weight:400;letter-spacing:1px;color:var(--ink-soft);opacity:1}
.answer::selection{background:var(--dark);color:var(--ink)}
.answer:focus{box-shadow:var(--in-deep)}
.answer.ok,.answer.ok:focus{
  color:var(--ok);
  box-shadow:var(--out), 0 0 0 3px var(--ok-soft), 0 0 26px var(--ok-soft);
}
.answer.no,.answer.no:focus{
  color:var(--no);
  box-shadow:var(--in-deep), inset 0 0 0 2px var(--no-soft), 0 0 0 3px var(--no-soft);
}
.answer.shake{animation:shake .42s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}
.toast{
  width:100%;height:46px;flex:0 0 auto;border-radius:23px;background:var(--bg);
  box-shadow:var(--in);display:flex;align-items:center;justify-content:center;
  padding:0 16px;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.3px;
  transition:box-shadow .25s ease, transform .25s ease, color .25s ease;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.toast span{display:block;opacity:0;transform:translateY(6px);transition:opacity .25s ease, transform .25s ease}
.toast.show{box-shadow:var(--out), 0 0 24px var(--tint);transform:translateY(-2px)}
.toast.show span{opacity:1;transform:translateY(0)}
.toast.ok{color:var(--ok);--tint:var(--ok-soft);font-size:22px;font-weight:700;letter-spacing:2px}
.toast.no{color:var(--no);--tint:var(--no-soft)}
.toast.ok.show span{animation:textPop .45s cubic-bezier(.2,1.35,.4,1)}
.toast.no.show span{animation:textShake .45s ease}
@keyframes textPop{0%{opacity:0;transform:scale(.65)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes textShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:420px){
  .card{padding:20px;border-radius:30px;gap:22px}
  .controls{gap:12px}
  .btn{width:58px;height:58px}
  .answer{height:58px;flex-basis:160px;font-size:22px}
  .frame{border-radius:22px;padding:14px}
  .toast{font-size:13px;height:42px;padding:0 12px}
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>

  function press(btn) {
    btn.classList.add('is-pressed');
    setTimeout(function () { btn.classList.remove('is-pressed'); }, 170);
  }
  function showNext() {
    if (!DATA.length) return;
    clearTimeout(switchTimer);
    clearBadge();
    clearFx();
    clearToast();
    current = nextIndex();
    lastIndex = current;
    var item = DATA[current];
    solved = false;
    fallbackUsed = false;
    answer.value = '';
    answer.classList.remove('ok', 'no', 'shake');
    broken.classList.remove('show');
    photo.style.visibility = 'visible';
    photo.classList.remove('ready');

    var local = item.f ? 'images/' + item.f : null;
    photo.onload = function () { photo.classList.add('ready'); };
    photo.onerror = function () {
      if (!fallbackUsed && local && item.u) {
        fallbackUsed = true;
        photo.src = item.u;
      } else {
        photo.classList.remove('ready');
        photo.style.visibility = 'hidden';
        broken.classList.add('show');
        live.textContent = '图片加载失败';
      }
    };
    photo.src = local || item.u;
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
      answer.focus();
    }
  }
  function check() {
    press(checkBtn);
    if (!DATA.length || solved) return;
    var raw = answer.value.trim();
    if (!raw) {
      shake();
      live.textContent = '请输入号数';
      return;
    }
    if (!/^\d+$/.test(raw)) {
      feedback(false, randomWrong());
      shake();
      answer.select();
      return;
    }
    if (Number(raw) === Number(DATA[current].a)) {
      solved = true;
      feedback(true, RIGHT_MSG);
      clearTimeout(switchTimer);
      switchTimer = setTimeout(showNext, AUTO_NEXT_MS);
    } else {
      feedback(false, randomWrong());
      shake();
      answer.select();
    }
  }
  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', function () { press(resetBtn); showNext(); });
  answer.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); check(); }
  });
  answer.addEventListener('input', function () {
    if (solved) return;
    clearBadge();
    clearFx();
    answer.classList.remove('ok', 'no');
  });
  live.textContent = '共 ' + TOTAL + ' 张图片';
  showNext();
})();
</script>
</body>
</html>
